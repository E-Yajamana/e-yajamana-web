services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - db
    networks:
      - eyajamana_network
  web:
    image: nginx:alpine
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - eyajamana_network
  db:
    image: "mysql:8.1.0"
    ports:
      - "3360:3306"
    container_name: db
    environment:
      - MYSQL_USER=root
      - MYSQL_DATABASE=e-yajamana
      - MYSQL_PASSWORD=secret
      - MYSQL_ROOT_PASSWORD=secret
    volumes:
      - db_eyajamana:/var/lib/mysql
    networks:
      - eyajamana_network

volumes:
  db_eyajamana:
    external: true

networks:
  eyajamana_network:
    driver: bridge
